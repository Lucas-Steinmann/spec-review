id: UI-002
type: ui_design
title: Browser repository overview and review workspace
description: |
  Open on a repository overview with the local folder and saved gh-accessible repositories in a left list.
  Show open pull requests and available Actions state. Selecting a repository or pull request opens the
  detailed revision and comparison workspace. Display documents, categories, links, diagrams, and field or
  Markdown differences. Mark changed Markdown lines with side-specific bars and light backgrounds, and
  changed words with stronger color. Keep filters and category buttons usable at narrow widths. Show loading
  status while requests are pending without blocking other navigation. Provide Hide superseded, checked by
  default, and the Changes only comparison filter; retain both checkbox values across page reloads. Give
  controls and dialogs accessible names, show keyboard focus, and restore focus when a dialog closes. In the
  revision bar, place a Review/Compare selector before the target revision selector and retain its value
  across page reloads. Hide the base selector in Review mode and show it in Compare mode. Confirm applies the selection for the chosen mode;
  changing a selection alone does not load a revision or comparison.

  ![Browser review workspace mockup](../../mockups/rendered/browser-workspace.png)
