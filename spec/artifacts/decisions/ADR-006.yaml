id: ADR-006
type: decision
title: Use XDG locations for settings and render caches
status: accepted
context: Settings and rendered diagrams must survive review sessions without adding generated files
  to the repository being reviewed.
decision: Persist options in the XDG configuration directory and PNGs in the XDG cache directory.
rationale: User-scoped directories keep preferences and derived image data available across sessions
  while leaving the specification tree free of local cache files.
addresses:
- REQ-021
- REQ-028
