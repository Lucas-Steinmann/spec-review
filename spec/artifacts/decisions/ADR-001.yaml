id: ADR-001
type: decision
title: Python review services and browser frontend
status: accepted
context: The browser needs snapshot, navigation, comparison, and rendering services.
decision: Use frontend-independent Python review services behind a read-only HTTP API and a Svelte browser frontend.
rationale: The service boundary keeps review logic reusable and separates it from browser presentation.
