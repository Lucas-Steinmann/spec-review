id: ADR-011
type: decision
title: Default commit selections in the diff modal
status: accepted
context: The repository default changed, while the approved modal commit defaults remain applicable.
decision: Default commit selections to HEAD^ and HEAD, or HEAD twice when no parent exists. Require Compare to activate the selection.
