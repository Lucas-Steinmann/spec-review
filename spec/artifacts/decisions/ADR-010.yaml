id: ADR-010
type: decision
title: Use the current directory as the default repository
status: superseded
context: The reviewer requested that omitted --repo select the working directory, including when launched from the spec-review submodule.
decision: Resolve an omitted --repo to the process current working directory and use ./spec/ by default. Use --repo and --spec-dir for explicit selection.
superseded_by: REQ-031
addresses:
- REQ-031
- REQ-026
