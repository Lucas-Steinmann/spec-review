id: UC-006
type: use_case
title: Inspect changed artifacts and categories
actors:
- ACTOR-001
goal_refs:
- GOAL-002
description: In the terminal interface, review differences in artifact content and diagrams after selecting revisions as described in UC-005. Browser comparison is covered by UC-008.
preconditions:
- The selected repository contains a specification, or selected historical revisions are available locally.
main_flow: |-
  1. Inspect orange changed items, green additions, and red deletions in the left-hand list.
  2. Use stars on the bottom categories to locate affected artifact groups.
  3. Select an artifact or overview.
  4. Read an inline diff or aligned two-panel comparison.
  5. When inline images are enabled, review the target version of each diagram.
  6. Follow links using the version from which they appear.
postconditions: The reviewer can distinguish changes, additions, and removals and understand their content.
source:
  - type: conversation
    file: "spec/sources/chat.md"
    section: "Requested improvements, October 2, 2026"
  - type: conversation
    file: "spec/sources/chat.md"
    section: "Scope, journey overlap, and computed backlinks, October 12, 2026"
