id: UC-008
type: use_case
title: Review a local specification in a browser
actors:
- ACTOR-001
goal_refs:
- GOAL-001
- GOAL-002
description: In the browser, add and review multiple local specification folders. Browse artifacts as in UC-001,
  follow links as in UC-002, and inspect diagrams as in UC-003. Review Git worktrees from the overview without switching
  branches.
preconditions:
- The server can read the selected local folder.
main_flow: '1. Use Add to browse a local folder on the server and select its relative specification directory.

  2. Select the saved folder in the overview and open its current-file review.

  3. For a Git repository, choose a base branch and open a worktree card, or select revisions in the detail workspace.

  4. Review documents or compare snapshots, following links and inspecting images in the appropriate source context.

  5. Return to the overview to review another worktree or saved folder; continue navigating while requests load.'
postconditions: The browser displays the local specification and requested comparison. Browser-specific interaction,
  accessibility, and loading behavior is defined by the related requirements and UI design.
related:
- UC-001
- UC-002
- UC-003
