id: UC-008
type: use_case
title: Navigate projects and review GitHub specifications in a browser
actors:
- ACTOR-001
goal_refs:
- GOAL-001
description: Navigate multiple GitHub specification repositories and inspect a revision or comparison in the browser review workspace.
preconditions:
- The local repository folder contains a specification, or GitHub access is configured through an App installation or an authenticated GitHub CLI account with access to the desired repository.
main_flow: |-
  1. Open the browser application overview.
  2. Select the local folder, or use Add at the top-right to add an accessible GitHub repository.
  3. For GitHub, select a saved repository from the left sidebar and review its open pull requests and available GitHub Actions state.
  4. Open the local folder or selected GitHub repository in its detailed review view.
  5. Review the default branch or select a pull request, branch, or commit and inspect a revision or comparison.
postconditions: The browser displays the selected repository's specification documents and revision comparison when requested. The overview remains available for navigation among saved repositories.
addresses:
- REQ-034
- REQ-035
- REQ-036
