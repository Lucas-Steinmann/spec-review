id: UC-008
type: use_case
title: Review a local specification in a browser
actors:
- ACTOR-001
goal_refs:
- GOAL-001
- GOAL-002
description: Inspect the selected local repository's specification and compare its working tree, branches, or commits in the browser review workspace.
preconditions:
- The selected local repository folder contains a specification or locally available historical revisions.
main_flow: |-
  1. Open the browser application overview and select the local folder.
  2. Open its detailed review view and select the working tree, a branch, or a commit.
  3. Read a revision or compare two selected revisions.
  4. Continue navigating while a comparison loads, then inspect its results.
postconditions: The browser displays the local specification and requested comparison with keyboard-accessible controls. The overview remains available.
