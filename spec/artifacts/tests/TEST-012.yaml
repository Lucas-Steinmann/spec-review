id: TEST-012
type: test
title: Render WebUI documents with TUI content semantics
verifies:
- REQ-036
- REQ-048
description: Open artifacts and maintained views in the Svelte WebUI. Confirm relationships and Markdown links navigate through the snapshot-aware resolver, ambiguous links present choices, unresolved links explain the target, and external links open externally. Confirm fenced and standalone diagrams retain readable source and show locally rendered images or diagnostics. Confirm specification images fit within the document pane at desktop and narrow widths. Open an image by mouse and keyboard, verify it opens in a modal fitted to the window, exercise zoom in, zoom out, and fit-to-window controls, then close it and confirm keyboard focus returns to the image. Confirm source metadata is displayed on one line and list-valued preconditions and postconditions appear as bullets.
