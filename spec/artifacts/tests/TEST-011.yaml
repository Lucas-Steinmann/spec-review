id: TEST-011
type: test
title: Load selected local revisions in the WebUI
verifies:
- REQ-034
description: Start the browser without a folder argument, add a local folder through Add, and open its review without
  contacting gh. Confirm local revisions and comparisons show changed, added, and deleted documents with base and
  target content. Reload a selected document in an applied revision and a worktree comparison, including a followed
  link, and confirm the repository, revision contexts and document are restored. Repeat for a GitHub comparison.
  Return to the overview and reload to confirm it remains open. Confirm the API accepts the empty working-tree revision
  on either side and categories containing changes are marked. Confirm the removed /api/github routes are absent.

