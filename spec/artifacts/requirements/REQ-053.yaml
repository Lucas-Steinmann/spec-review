id: REQ-053
type: requirement
title: Validate specification kits independently of this checkout
category: validation
status: specified
statement: Provide a read-only validation command accepting a project root and custom specification directory. Validate
  loader diagnostics, artifact relationships, supersession targets, and maintained guide links including nested
  guides. An empty initialized scaffold must validate. Installed package resources must support initialization,
  validation, and updates without the source checkout or built browser assets. Treat the recommended type-folder
  layout as an authoring convention without parser restrictions. Continue reading and validating existing flat or
  differently nested YAML artifacts and custom types. Initialization and updates must not migrate or delete
  project artifacts to enforce storage conventions.
