id: REQ-028
type: requirement
title: Keep navigation responsive during diagram rendering
category: diagrams
status: specified
statement: Diagram rendering must not block document navigation. A failed or timed-out render leaves
  the diagram source readable and reports a local diagnostic. Reopening an unchanged diagram reuses
  an available render result. The rendering timeout defaults to 30 seconds and is configurable.
