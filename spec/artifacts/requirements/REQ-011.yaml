statement: Selecting Diff opens a modal where the reviewer can choose two commits from the repository’s
  history. Default the selections to HEAD^ and HEAD, or HEAD twice when no parent exists. Activate the
  selection only after the reviewer chooses Compare, then show the document comparison.
