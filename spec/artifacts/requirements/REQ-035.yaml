id: REQ-035
type: requirement
title: Navigate saved repositories from the browser overview
category: integrations
status: specified
statement: Provide an overview with saved local folders and GitHub repositories in a shared left sidebar. Through
  Add, choose a local folder using a server-side folder browser starting at the server user’s home, with parent
  navigation, readable child directories, and direct path entry, or choose a repository accessible through gh. Allow
  an optional relative specification directory, defaulting to spec. Save multiple folders and repositories across
  reloads, prevent duplicate local path/spec-directory pairs, and retain saved unavailable folders with useful errors.
  Browser startup uses saved sources or an empty overview; it does not automatically add a folder from the command
  line. Preserve existing saved GitHub entries. Local folder addition and selection work independently of GitHub
  authentication and loading. Canceling the Add dialog discards any pending addition response.
