id: REQ-048
type: requirement
title: Fit and zoom browser specification images
category: browsing
status: specified
statement: |
  In the browser review workspace, constrain specification images to the available document width. Let the
  reviewer open an image in a focused viewer, fit it to the window, zoom in and out with Ctrl/Cmd+wheel or the toolbar, and close the viewer
  with keyboard-accessible controls. Plain wheel input pans vertically, horizontal wheel input pans
  horizontally, and Shift+wheel pans horizontally. At opening and fit reset, 100% fills the available
  viewer area while preserving aspect ratio, enlarging small images when needed. Allow zoom from 25%
  to 2000% relative to the fitted size. Wheel zoom responds continuously to scroll distance;
  equal scroll distances produce equal scale changes regardless of event count.
