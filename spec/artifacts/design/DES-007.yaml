id: DES-007
type: design
title: Browser frontend and GitHub repository providers
description: |
  The Svelte WebUI is built to static assets and served by the read-only Python HTTP server. It consumes the existing snapshot and comparison services. The local provider reads the selected folder and Git history. GitHub access supports server-side GitHub App credentials (enumerating installations and minting short-lived installation tokens) or an existing authenticated GitHub CLI account (`gh auth login`). Both providers enumerate accessible repositories. GitHub revisions are fetched with complete Git objects through Git's pack protocol into a persistent local bare mirror in the user cache; snapshots are parsed from cached Git objects so comparisons avoid one API request per specification blob and do not trigger slow lazy blob fetches. Existing incomplete mirrors are refreshed once before use. The browser opens on a repository overview with a saved repository sidebar and an Add action. The overview presents open pull requests and available Actions checks. Selecting a repository or pull request opens the existing revision and comparison workspace. Saved repository selections are stored in browser-local settings. The browser selects repository revisions and renders snapshots and comparison results.
