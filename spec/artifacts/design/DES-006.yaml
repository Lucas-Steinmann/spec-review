id: DES-006
type: design
title: Package and specification tooling
description: |
  Package the reviewer as a separately versioned Python project that can be pinned by a consuming
  repository through a Git submodule. Resolve the repository from the current directory unless
  --repo selects another path; resolve specification content from ./spec unless --spec-dir overrides it.
  Store canonical YAML artifacts in spec/artifacts, source provenance in spec/sources/chat.md, and
  maintained Markdown guides in spec/views. Load those guides directly in the reviewer. Keep artifact
  authoring guidance in docs/artifact-authoring.md and link it from agent instructions. Validate IDs,
  relationships, supersession targets, and guide links with scripts/validate_spec_views.py.

  ```mermaid
  flowchart LR
    Chat[Conversation provenance] --> Artifacts[Canonical YAML artifacts]
    Artifacts --> Guides[Maintained reading guides]
    Guides --> Tool
    Artifacts --> Tool[spec-review package]
    Tool --> Artifacts
    Artifacts --> Tests[Acceptance scenarios]
  ```
addresses:
- REQ-017
- REQ-026
- REQ-031
source:
