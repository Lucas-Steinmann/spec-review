id: DES-006
type: design
title: Package and specification tooling
description: "Package the reviewer as a separately versioned Python project that can be pinned by a consuming\n\
  repository through a Git submodule. Browser review selects folders through Add; kit commands accept --repo and\
  \ --spec-dir.\nStore canonical YAML artifacts in spec/artifacts, source provenance in spec/sources/chat.md, and\n\
  maintained Markdown guides in spec/views. Load those guides directly in the reviewer. Keep artifact\nauthoring\
  \ guidance in spec/docs/spec-review/artifact-authoring.md and link it from agent instructions. Validate IDs,\n\
  relationships, supersession targets, and guide links with spec-review validate; scripts/validate_spec_views.py\
  \ remains a compatibility wrapper.\nPortable kit installation and updates are specified in DES-011.\n\n```mermaid\n\
  flowchart LR\n  Chat[Conversation provenance] --> Artifacts[Canonical YAML artifacts]\n  Artifacts --> Guides[Maintained\
  \ reading guides]\n  Guides --> Tool\n  Artifacts --> Tool[spec-review package]\n  Tool --> Artifacts\n  Artifacts\
  \ --> Tests[Acceptance scenarios]\n```\n"
