id: DES-003
type: design
title: Revision snapshots and semantic comparison
description: |
  Read selected Git revisions without changing the checkout. Match YAML artifacts by stable ID and compare
  typed field values; compare maintained Markdown views as text. Include documents present on either side,
  retain deletions, and count a type change in both categories. Produce field and prose hunks for inline
  presentation and aligned rows for two-panel presentation. Carry snapshot provenance through content and
  links. The interface arrangement and mockup are specified by UI-001.
