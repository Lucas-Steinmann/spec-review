id: DES-010
type: design
title: Separate design categories in review snapshots
description: |
  Represent software design with type design and interface design with type ui_design. Register them as
  Technical Design and UI Design categories in terminal and browser snapshots. Use the stable artifact ID for identity and comparison,
  so moving an artifact between categories retains links and reports a type change in both categories.
  Interpret mockup links relative to the UI design artifact path and keep technical architecture diagrams
  in design descriptions.
