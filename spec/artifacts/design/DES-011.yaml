id: DES-011
type: design
title: Portable kit packaging and three-way upgrade journal
addresses:
- REQ-051
- REQ-052
- REQ-053
description: Package canonical reference documents, repository skills, spec editing instructions, and empty
  starter templates as Python resources. Add init, update, and validate CLI commands while retaining existing review
  flags. A marked root AGENTS.md block loads maintenance instructions for implementation changes. Store upstream
  content and version in <spec-dir>/docs/spec-review/.kit/state.json; install references alongside it and skills in
  .agents/skills/. Keep scaffold starters outside managed update files. Migrate old layouts through a resumable
  journal, preserving customized content, destination conflicts, and legacy files linked from project starters.
  Compare base/local/incoming text; journal operations and conflicts before atomic replacements, reject concurrent
  edits during replay, and acknowledge all resolved paths with update --accept-merge and repeated --resolved flags.
  Verify the same bundled target throughout a pending update. Explicit deletion can be preserved as a customization.
  Shared validator code replaces the repository-specific implementation; its original script remains a compatibility
  wrapper. Browser assets are bundled when available but are not required to build a kit-only wheel.
  Keep the authoritative type-folder mapping in the installed artifact-authoring guide and reference it from
  initial agent instructions, authoring skills, setup guidance, and empty starter guides. Apply specification-path,
  relative-link, and CLI command rewriting to both managed instructions and starter contents. Keep starters out
  of managed upgrade baselines; preserve normal content-derived version handling and project customizations.
  Force-include canonical docs, skills, and spec editing instructions once in wheels; avoid duplicate bundled
  source copies. Keep this project's canonical kit references and skills in the same layout as installed kits;
  load them from there in editable installations and include them in built packages. Leave the recursive artifact
  reader independent of folder and filename conventions.
