id: DES-009
type: design
title: Browser development and distribution
description: "Vite serves the Svelte frontend with hot reload and proxies API requests to the Python server. Storybook\
  \ provides\nan interactive catalog of stories composed from the same Svelte UI and dialog components used by the\
  \ application.\nLucide Svelte provides tree-shaken interface icons. Playwright exercises rendered browser behavior.\
  \ Production\nassets are generated in an ignored build directory and included in Python distributions after a\
  \ frontend build.\n\n```mermaid\nflowchart LR\n  Svelte[Svelte source] --> Vite[Vite development server]\n  Svelte\
  \ --> Stories[Storybook stories]\n  Stories --> Catalog[Interactive component catalog]\n  Vite --> Browser[Browser\
  \ and Playwright]\n  Vite --> Build[Production frontend build]\n  Build --> Package[Python distribution]\n  Browser\
  \ --> API[Local Python HTTP server]\n```\n\nCompose browser mockups and component examples from the application's\
  \ Svelte components; do not recreate them in\nstandalone HTML/CSS. Application-level stories mount App.svelte\
  \ with deterministic API fixtures, and the screenshot\nrenderer captures Storybook output. Storybook uses the\
  \ same theme tokens and component source. Dialog layout regressions inspect\nthe actual browser application at\
  \ desktop, 360px, and 320px widths in Paper and Dark themes, checking label\nspacing, control dimensions, sibling\
  \ separation, viewport containment, primary appearance, and focus.\nDeterministic data in spec/mockups/src/browser-dialogs.mjs\
  \ also drives previews of the compiled Svelte dialogs\nthrough scripts/render_spec_mockups.mjs.\nFrontend component,\
  \ Storybook, and verification conventions are\ndocumented in frontend/README.md; inspect live dialog screenshots\
  \ in addition to functional checks.\n"
