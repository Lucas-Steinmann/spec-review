id: DES-004
type: design
title: Description blocks and local diagram images
description: Extract interleaved prose, code, and Mermaid and PlantUML blocks from descriptions and overviews. Run
  local renderers asynchronously without a shell, cache SVG results outside the repository, and present images or
  diagnostics in the browser. Request SVG output from both renderers, validate the SVG root,
  and use a versioned SVG cache key to avoid reusing earlier raster results. Serve SVG as
  image/svg+xml data URLs displayed through image elements in both document and modal viewer.
