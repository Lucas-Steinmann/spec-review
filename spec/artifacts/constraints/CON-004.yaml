id: CON-004
type: constraint
title: Review without editing or migrating specifications
statement: Terminal and browser review do not edit specification content or migrate the companion project's legacy documents. The first release was terminal-only; the later browser interface is in scope.
  Explicit CLI kit initialization and update commands may write kit files; they are separate from terminal and browser review.
