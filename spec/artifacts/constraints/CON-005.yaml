id: CON-005
type: constraint
title: Use the GitHub CLI for the current GitHub integration
statement: The current browser may review local repositories and GitHub repositories accessible to the server's authenticated `gh` CLI account. Do not expose a direct GitHub App or Python HTTP client integration. A hosted version with multiple user accounts requires a separate access model before it is introduced.
