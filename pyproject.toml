[project]
name = "spec-review"
version = "0.1.0"
description = "Browse and compare YAML specifications in a terminal or browser"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.3,<7", "textual>=8.2.8,<9", "textual-image>=0.14.1,<0.15", "rich>=15,<16", "markdown-it-py>=4,<5"]

[project.scripts]
spec-review = "spec_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_review"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "spec_review/webui"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live_github: opt-in, read-only integration checks against GitHub.com"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
