[project]
name = "spec-review"
version = "0.1.0"
description = "Browse and compare YAML specifications in a terminal or browser"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.3,<7", "textual>=8.2.8,<9", "textual-image>=0.14.1,<0.15", "rich>=15,<16", "markdown-it-py>=4,<5"]

[project.scripts]
spec-review = "spec_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_review"]

[tool.hatch.build.targets.wheel.force-include]
"docs/spec-review/artifact-authoring.md" = "spec_review/kit/docs/spec-review/artifact-authoring.md"
"docs/spec-review/artifact-format.md" = "spec_review/kit/docs/spec-review/artifact-format.md"
"docs/spec-review/maintenance.md" = "spec_review/kit/docs/spec-review/maintenance.md"
"docs/spec-review/setup.md" = "spec_review/kit/docs/spec-review/setup.md"
"skills/spec-authoring" = "spec_review/kit/skills/spec-authoring"
"skills/spec-supersession-cleanup" = "spec_review/kit/skills/spec-supersession-cleanup"
"skills/spec-health-review" = "spec_review/kit/skills/spec-health-review"
"skills/spec-kit-update" = "spec_review/kit/skills/spec-kit-update"
"spec/AGENTS.md" = "spec_review/kit/spec/AGENTS.md"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/build_hook.py"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live_github: opt-in, read-only integration checks against GitHub.com"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
