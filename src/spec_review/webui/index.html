<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>spec-review</title>
<style>
:root{font:15px system-ui;color:#20252b;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}header{background:#17212b;color:white;padding:14px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header strong{font-size:19px;margin-right:auto}select,input,button{font:inherit;padding:7px 9px;border:1px solid #aab4be;border-radius:5px;background:white}button{cursor:pointer}main{display:grid;grid-template-columns:310px 1fr;height:calc(100vh - 108px)}aside{overflow:auto;border-right:1px solid #ccd3da;background:white;padding:12px}.item{padding:10px;border-bottom:1px solid #e1e5e9;cursor:pointer}.item:hover,.item.active{background:#eaf2fc}.item b{display:block}.content{overflow:auto;padding:24px 5vw}article{max-width:1000px;background:white;border:1px solid #dce1e6;border-radius:8px;padding:24px;white-space:pre-wrap;overflow-wrap:anywhere}article h2{margin-top:0}pre{white-space:pre-wrap;background:#f4f6f8;padding:12px;border-radius:5px}.meta{color:#596773;font-size:13px}nav{padding:8px 22px;background:#fff;border-bottom:1px solid #ccd3da;display:flex;gap:9px;align-items:center;flex-wrap:wrap}#error{color:#a22;margin-left:8px}@media(max-width:700px){main{grid-template-columns:40% 60%}.content{padding:12px}article{padding:14px}}
</style>
<header><strong>spec-review</strong><span id="localname"></span><select id="source"><option value="local">Local folder</option><option value="github">GitHub App</option></select><span id="ghcontrols" hidden><select id="installation"></select><select id="repo"></select></span></header>
<nav><select id="revision"></select><select id="base" hidden></select><button id="compare">Compare</button><button id="browse">Review version</button><select id="category"></select><span id="error"></span></nav>
<main><aside><input id="search" placeholder="Filter ID or title" style="width:100%"><div id="list"></div></aside><section class="content" id="content"><article>Select a document to review.</article></section></main>
<script>
const $=s=>document.querySelector(s);let source='local',installation='',repo='',snapshot=null,comparison=null,active='',revisionRows=[],defaultBranch='',repoDefaults={};
async function api(path){let r=await fetch(path);let j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}function opts(sel,items,label,value,selected){sel.innerHTML='';for(const x of items){let o=document.createElement('option');o.textContent=label(x);o.value=value(x);if(o.value===selected)o.selected=true;sel.append(o)}}function query(extra={}){let p=new URLSearchParams(extra);if(source==='github'){p.set('installation',installation);let [owner,name]=repo.split('/');p.set('owner',owner||'');p.set('repo',name||'')}return p.toString()}
async function init(){try{let s=await api('/api/status');$('#localname').textContent=s.repo+' · '+s.spec_dir;await localRevs();await load();}catch(e){err(e)}}function err(e){$('#error').textContent=e.message||String(e)}
async function localRevs(){let d=await api('/api/local/commits');opts($('#revision'),[{name:'Working tree',sha:''},...d.branches.map(name=>({name,sha:name})),...d.commits],x=>x.name||x.subject,x=>x.sha,'');opts($('#base'),d.commits,x=>x.sha.slice(0,10)+' '+x.subject,x=>x.sha,d.commits[1]?.sha||'')}
async function githubInit(){let xs=await api('/api/github/installations');opts($('#installation'),xs,x=>x.account+' ('+x.type+')',x=>x.id,String(xs[0]?.id||''));installation=$('#installation').value;await repos()}
async function repos(){installation=$('#installation').value;let xs=await api('/api/github/repos?installation='+encodeURIComponent(installation));repoDefaults=Object.fromEntries(xs.map(x=>[x.full_name,x.default_branch]));opts($('#repo'),xs,x=>x.full_name+' · '+x.default_branch,x=>x.full_name,repo);repo=$('#repo').value;defaultBranch=repoDefaults[repo]||'';await githubRevs()}
async function githubRevs(){let q=query(),bs=await api('/api/github/branches?'+q),ps=await api('/api/github/pulls?'+q),cs=await api('/api/github/commits?'+query({ref:defaultBranch}));let rows=[...bs.map(x=>({name:'Branch · '+x.name,sha:x.sha,branch:x.name})),...ps.map(x=>({name:'PR #'+x.number+' · '+x.title,sha:x.head,base:x.base,pr:true})),...cs.map(x=>({name:'Commit · '+x.sha.slice(0,10)+' · '+x.subject,sha:x.sha,commit:true}))];rows.sort((a,b)=>(a.branch===defaultBranch?-1:b.branch===defaultBranch?1:0));revisionRows=rows;opts($('#revision'),rows,x=>x.name,x=>x.sha,(rows.find(x=>x.branch===defaultBranch)||rows[0])?.sha||'');opts($('#base'),rows,x=>x.name,x=>x.sha,cs[1]?.sha||rows.find(x=>x.base)?.base||rows[1]?.sha||'')}
async function load(){try{comparison=null;let ref=$('#revision').value;let path=source==='local'?'/api/local/snapshot?ref='+encodeURIComponent(ref):'/api/github/snapshot?'+query({ref});snapshot=await api(path);showCategories();drawList()}catch(e){err(e)}}async function compareNow(){try{let a=$('#base').value,b=$('#revision').value;if(!b)throw Error('Choose a target version first');let path=source==='local'?'/api/local/compare?base='+encodeURIComponent(a)+'&target='+encodeURIComponent(b):'/api/github/compare?'+query({base:a,target:b});comparison=await api(path);snapshot=comparison.target;showCategories();drawList()}catch(e){err(e)}}function showCategories(){let cats=comparison?Object.assign({},comparison.base.categories,comparison.target.categories):snapshot.categories;opts($('#category'),Object.keys(cats).map(k=>({key:k,name:cats[k]})),x=>x.name,x=>x.key,Object.keys(cats)[0]||'')}
function drawList(){let q=$('#search').value.toLowerCase(),cat=$('#category').value,el=$('#list');el.innerHTML='';let rows=comparison?Object.values(comparison.changes).map(c=>({doc:c.new||c.old,status:c.status})):Object.values(snapshot.documents).map(doc=>({doc,status:'unchanged'}));for(let x of rows.filter(x=>x.doc.type===cat&&(x.doc.id+' '+x.doc.title).toLowerCase().includes(q)).sort((a,b)=>a.doc.id.localeCompare(b.doc.id))){let d=document.createElement('div');d.className='item'+(active===x.doc.id?' active':'');let b=document.createElement('b');b.textContent=(x.status==='added'?'+ ':x.status==='deleted'?'− ':x.status==='changed'?'~ ':'')+x.doc.id;let t=document.createElement('span');t.textContent=x.doc.title;d.append(b,t);d.onclick=()=>render(x.doc.id);el.append(d)}}
function render(id){active=id;let change=comparison?.changes[id],d=snapshot.documents[id]||change?.old;if(!d)return;let a=document.createElement('article'),h=document.createElement('h2');h.textContent=d.title;a.append(h);let m=document.createElement('div');m.className='meta';m.textContent=d.id+' · '+d.type+' · '+d.path+(change?' · '+change.status:'');a.append(m);if(d.error){let e=document.createElement('pre');e.textContent=d.error+'\n'+d.text;a.append(e)}else if(d.type==='overview'&&!change){a.append(markdown(d.text))}else if(change){let old=change.old?.fields||{},neu=change.new?.fields||{};if(change.old?.type==='overview')old={content:change.old.text};if(change.new?.type==='overview')neu={content:change.new.text};let keys=new Set([...Object.keys(old),...Object.keys(neu)]);for(let k of keys){if(['id','type','title'].includes(k))continue;let hh=document.createElement('h3');hh.textContent=k.replaceAll('_',' ');a.append(hh);let grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:12px';for(let [label,obj] of [['Base',old],['Target',neu]]){let side=document.createElement('div'),cap=document.createElement('div');cap.className='meta';cap.textContent=label;side.append(cap);side.append(markdown(obj[k]===undefined?'(absent)':typeof obj[k]==='string'?obj[k]:JSON.stringify(obj[k],null,2)));grid.append(side)}a.append(grid)}}else if(d.type==='overview'){a.append(markdown(d.text))}else for(let [k,v] of Object.entries(d.fields||{})){if(['id','type','title'].includes(k))continue;let hh=document.createElement('h3');hh.textContent=k.replaceAll('_',' ');a.append(hh);a.append(markdown(typeof v==='string'?v:JSON.stringify(v,null,2)))}$('#content').replaceChildren(a);drawList()}
function markdown(text){let box=document.createElement('div');let lines=text.split('\n'),code=false,buf=[],pre=null;for(let l of lines){if(l.trim().startsWith('```')){if(!code){pre=document.createElement('pre');buf=[];code=true}else{pre.textContent=buf.join('\n');box.append(pre);code=false}continue}if(code){buf.push(l);continue}if(l.trim()){let p=document.createElement('p');p.textContent=l;box.append(p)}}if(code){pre.textContent=buf.join('\n');box.append(pre)}return box}
$('#source').onchange=async()=>{source=$('#source').value;$('#ghcontrols').hidden=source!=='github';$('#base').hidden=false;try{if(source==='github')await githubInit();else await localRevs();await load()}catch(e){err(e)}};$('#installation').onchange=()=>repos().catch(err);$('#repo').onchange=()=>{repo=$('#repo').value;defaultBranch=repoDefaults[repo]||'';githubRevs().then(load).catch(err)};$('#browse').onclick=load;$('#compare').onclick=compareNow;$('#category').onchange=drawList;$('#search').oninput=drawList;$('#revision').onchange=async()=>{let x=revisionRows.find(r=>r.sha===$('#revision').value);if(x?.base)$('#base').value=x.base;await load()};init();
</script></html>
